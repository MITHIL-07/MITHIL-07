<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="blurBlob" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="20" y="20" width="860" height="480" rx="22"/>
    </clipPath>
  </defs>

  <style>
    .dim   { fill: #64748b; }
    .txt   { fill: #1e1b3a; }
    .key   { fill: #6d28d9; font-weight: 600; }
    .val   { fill: #0e7490; }
    .accentText { fill: url(#accentGrad); font-weight: 700; }

    @keyframes floatA { 0%,100% { transform: translate(0px,0px); } 50% { transform: translate(14px,-18px); } }
    @keyframes floatB { 0%,100% { transform: translate(0px,0px); } 50% { transform: translate(-16px,14px); } }
    .blobA { animation: floatA 7s ease-in-out infinite; }
    .blobB { animation: floatB 8s ease-in-out infinite; }

    @keyframes borderPulse { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
    .cardBorder { animation: borderPulse 3.5s ease-in-out infinite; }

    @keyframes reveal {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .row  { opacity: 0; animation: reveal .5s ease-out forwards; }
    .r1  { animation-delay: .10s; }
    .r2  { animation-delay: .30s; }
    .r3  { animation-delay: .50s; }
    .r4  { animation-delay: .70s; }
    .r5  { animation-delay: .90s; }
    .r6  { animation-delay: 1.10s; }
    .r7  { animation-delay: 1.35s; }
    .r8  { animation-delay: 1.55s; }
    .r9  { animation-delay: 1.75s; }
    .r10 { animation-delay: 1.95s; }
    .r11 { animation-delay: 2.20s; }

    @keyframes nodePulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    .n1 { animation: nodePulse 2.2s ease-in-out infinite; }
    .n2 { animation: nodePulse 2.2s ease-in-out infinite .3s; }
    .n3 { animation: nodePulse 2.2s ease-in-out infinite .6s; }
    .n4 { animation: nodePulse 2.2s ease-in-out infinite .9s; }
    .n5 { animation: nodePulse 2.2s ease-in-out infinite 1.2s; }
    .n6 { animation: nodePulse 2.2s ease-in-out infinite 1.5s; }

    @keyframes linkFlow { 0% { stroke-dashoffset: 24; } 100% { stroke-dashoffset: 0; } }
    .link { stroke: url(#accentGrad); stroke-width: 1.4; fill: none; opacity: .55;
            stroke-dasharray: 4 3; animation: linkFlow 1.2s linear infinite; }

    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .cursor { fill: #0891b2; animation: blink 1s step-start infinite; }

    .ascii { fill: #7c3aed; font-size: 13px; }
  </style>

  <!-- background -->
  <rect width="900" height="520" fill="url(#bgGrad)"/>
  <g clip-path="url(#cardClip)">
    <circle class="blobA" cx="140" cy="120" r="140" fill="#c4b5fd" filter="url(#blurBlob)"/>
    <circle class="blobB" cx="760" cy="420" r="160" fill="#67e8f9" filter="url(#blurBlob)"/>
  </g>

  <!-- glass card -->
  <rect x="20" y="20" width="860" height="480" rx="22" fill="rgba(255,255,255,0.55)" stroke="rgba(99,102,241,0.35)" stroke-width="1.4" class="cardBorder"/>

  <!-- window controls -->
  <circle cx="50" cy="52" r="6" fill="#ff5f56"/>
  <circle cx="72" cy="52" r="6" fill="#ffbd2e"/>
  <circle cx="94" cy="52" r="6" fill="#27c93f"/>
  <text x="450" y="57" text-anchor="middle" class="dim" font-size="13">mithil@github  ·  neural-shell v2</text>

  <line x1="44" y1="76" x2="856" y2="76" stroke="rgba(99,102,241,0.35)" stroke-width="1"/>

  <!-- LEFT: animated ascii / node art -->
  <g transform="translate(90,140)">
    <text x="0" y="-30" class="accentText" font-size="18">MITHIL-07</text>
    <text x="0" y="-8" class="dim" font-size="12">AI / ML Engineer in the making</text>

    <!-- layered neural net ascii-nodes -->
    <g font-size="20" text-anchor="middle">
      <text x="20"  y="60"  class="ascii n1">◉</text>
      <text x="20"  y="110" class="ascii n2">◉</text>
      <text x="20"  y="160" class="ascii n3">◉</text>

      <text x="120" y="35"  class="ascii n4">◉</text>
      <text x="120" y="85"  class="ascii n5">◉</text>
      <text x="120" y="135" class="ascii n6">◉</text>
      <text x="120" y="185" class="ascii n1">◉</text>

      <text x="220" y="60"  class="ascii n2">◉</text>
      <text x="220" y="110" class="ascii n3">◉</text>
      <text x="220" y="160" class="ascii n4">◉</text>
    </g>

    <g class="link">
      <path d="M20,60 L120,35"/>  <path d="M20,60 L120,85"/>
      <path d="M20,110 L120,35"/> <path d="M20,110 L120,85"/> <path d="M20,110 L120,135"/>
      <path d="M20,160 L120,135"/><path d="M20,160 L120,185"/>
      <path d="M120,35 L220,60"/>
      <path d="M120,85 L220,60"/> <path d="M120,85 L220,110"/>
      <path d="M120,135 L220,110"/><path d="M120,135 L220,160"/>
      <path d="M120,185 L220,160"/>
    </g>

    <text x="0" y="230" class="dim" font-size="11">// forward pass: input → hidden → output</text>
  </g>

  <!-- divider -->
  <line x1="380" y1="100" x2="380" y2="460" stroke="rgba(99,102,241,0.35)" stroke-width="1"/>

  <!-- RIGHT: typing info -->
  <g transform="translate(415,110)">
    <text class="row r1 key" x="0" y="0" font-size="15">mithil@dev<tspan class="dim">:~$ </tspan><tspan class="txt">whoami</tspan></text>

    <text class="row r2" x="0" y="40"><tspan class="key">Role</tspan><tspan class="dim">      ›  </tspan><tspan class="val">CS Student</tspan></text>
    <text class="row r3" x="0" y="66"><tspan class="key">Focus</tspan><tspan class="dim">     ›  </tspan><tspan class="val">AI / ML  +  DSA</tspan></text>
    <text class="row r4" x="0" y="92"><tspan class="key">Stack</tspan><tspan class="dim">     ›  </tspan><tspan class="val">Python · C++ · Web</tspan></text>
    <text class="row r5" x="0" y="118"><tspan class="key">Editor</tspan><tspan class="dim">    ›  </tspan><tspan class="val">VS Code</tspan></text>

    <line class="row r6" x1="0" y1="140" x2="435" y2="140" stroke="rgba(99,102,241,0.35)" stroke-width="1"/>

    <text class="row r6 key" x="0" y="168" font-size="14">$ ls ./projects</text>
    <text class="row r7" x="0" y="196"><tspan class="key">▹ smart-campus-assistant</tspan><tspan class="dim"> — college mgmt system</tspan></text>
    <text class="row r8" x="0" y="220"><tspan class="key">▹ pomodoro-timer</tspan><tspan class="dim"> — focus &amp; productivity app</tspan></text>
    <text class="row r9" x="0" y="244"><tspan class="key">▹ leetcode-solutions</tspan><tspan class="dim"> — daily DSA practice</tspan></text>

    <line class="row r9" x1="0" y1="266" x2="435" y2="266" stroke="rgba(99,102,241,0.35)" stroke-width="1"/>

    <text class="row r10 key" x="0" y="294" font-size="14">$ cat ./leetcode.json</text>
    <text class="row r11" x="0" y="322"><tspan class="key">"user"</tspan><tspan class="dim">:</tspan> <tspan class="val">"mithil_dave03"</tspan></text>
    <text class="row r11" x="0" y="346"><tspan class="key">"habit"</tspan><tspan class="dim">:</tspan> <tspan class="val">"daily grind 🔥"</tspan></text>

    <text class="row r11" x="0" y="378">mithil@dev<tspan class="dim">:~$ </tspan><tspan class="cursor">▊</tspan></text>
  </g>
</svg>
